# Spring Boot 애플리케이션의 모든 설정을 관리하는 파일입니다.
server:
  port: ${PORT:8080}

spring:
  # ===================================================================
  # == Render 배포용 (PostgreSQL) 설정 - 주석 처리합니다. ==
  # ===================================================================
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        show_sql: true
        format_sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  # ===================================================================
  # == 로컬 개발용 (MySQL) 설정 - 이 설정의 주석을 모두 해제합니다. ==
  # ===================================================================
  #datasource:
  #  driver-class-name: com.mysql.cj.jdbc.Driver
  #  url: jdbc:mysql://localhost:3306/jakdang_db?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
  #  username: root
  #  password: 316298 # Juno님의 MySQL 비밀번호
  #jpa:
  #  hibernate:
  #    ddl-auto: update
  #  properties:
  #    hibernate:
  #      show_sql: true
  #      format_sql: true
  #  database-platform: org.hibernate.dialect.MySQLDialect


  # Spring Mail 설정 (다시 587 포트로 변경하고, 상세 로그를 켭니다)
  mail:
    host: smtp.gmail.com
    port: 587                     # 다시 587로 변경 (표준)
    username: ${SPRING_MAIL_USERNAME}
    password: ${SPRING_MAIL_PASSWORD}
    properties:
      mail:
        debug: true               # [중요] 메일 전송 과정을 로그에 다 찍어줍니다!
        smtp:
          auth: true
          starttls:
            enable: true
            required: true        # [중요] 보안 연결 강제
          connectiontimeout: 5000 # 5초 동안 응답 없으면 바로 에러 (무한 대기 방지)
          timeout: 5000
          writetimeout: 5000

# JWT 설정 (보안을 위해 secret은 환경 변수로 이동 - 로컬에서도 동일하게 사용 가능)
