  # Spring Mail 설정 (다시 587 포트로 변경하고, 상세 로그를 켭니다)
mail:
  host: smtp.gmail.com
  port: 587
  username: ${SPRING_MAIL_USERNAME}
  password: ${SPRING_MAIL_PASSWORD}
  properties:
    mail:
      debug: true
      smtp:
        auth: true
        starttls:
          enable: true
          required: true
        ssl:
          trust: smtp.gmail.com  # [추가] 이 줄을 추가하면 보안 연결이 더 원활해집니다.
        connectiontimeout: 5000
        timeout: 5000
        writetimeout: 5000

