# Spring Boot 애플리케이션의 모든 설정을 관리하는 파일입니다.
server:
  port: ${PORT:8080}

spring:
  # ===================================================================
  # == Render 배포용 (PostgreSQL) 설정 - 활성화 ==
  # ===================================================================
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        show_sql: true
        format_sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  # ===================================================================
  # == 로컬 개발용 (MySQL) 설정 - 주석 처리됨 ==
  # ===================================================================
  # datasource:
  #   driver-class-name: com.mysql.cj.jdbc.Driver
  #   url: jdbc:mysql://localhost:3306/jakdang_db?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
  #   username: root
  #   password: your_password
  # jpa:
  #   hibernate:
  #     ddl-auto: update
  #   database-platform: org.hibernate.dialect.MySQLDialect

  # ===================================================================
  # == Spring Mail 설정 (최종: 465 포트 + SSL + IPv4) ==
  # ===================================================================
  mail:
    host: smtp.gmail.com
    port: 465
    username: ${SPRING_MAIL_USERNAME}
    password: ${SPRING_MAIL_PASSWORD}
    protocol: smtps              # [중요] 465 포트는 smtps 프로토콜을 사용합니다.
    properties:
      mail:
        debug: true              # 디버깅을 위해 로그 출력 유지
        smtp:
          auth: true
          ssl:
            enable: true         # 465 포트에서는 SSL을 반드시 켜야 합니다.
            trust: smtp.gmail.com
          starttls:
            enable: false        # SSL을 쓰므로 STARTTLS는 끕니다.
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

# ===================================================================
# == JWT 설정 (spring과 같은 레벨) ==
# ===================================================================
jwt:
  secret: 293IGlzIHRoaXMgc2VjcmV0IGtleT8gSXQgaXMgYSB2ZXJ5IHNlY3JldCBrZXkuIFBsZWFzZSBkb24ndCB0ZWxsIGFueW9uZSE=
  access-token-expiration-millis: 1800000