# Spring Boot 애플리케이션의 모든 설정을 관리하는 파일입니다.
server:
  port: ${PORT:8080}

spring:
  # ===================================================================
  # == Render 배포용 (PostgreSQL) 설정 - 활성화 ==
  # ===================================================================
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        show_sql: true
        format_sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  # ===================================================================
  # == 로컬 개발용 (MySQL) 설정 - 주석 처리됨 ==
  # ===================================================================
  # datasource:
  #   driver-class-name: com.mysql.cj.jdbc.Driver
  #   url: jdbc:mysql://localhost:3306/jakdang_db?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
  #   username: root
  #   password: your_password
  # jpa:
  #   hibernate:
  #     ddl-auto: update
  #   database-platform: org.hibernate.dialect.MySQLDialect

  # ===================================================================
  # == Spring Mail 설정 (587 포트 + 디버그 모드) ==
  # ===================================================================
  # 주의: 이 부분은 반드시 spring: 아래에 들여쓰기 되어야 합니다.
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${SPRING_MAIL_USERNAME}
    password: ${SPRING_MAIL_PASSWORD}
    properties:
      mail:
        debug: true               # 상세 로그 출력
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          ssl:
            trust: smtp.gmail.com # 보안 연결 신뢰 설정
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

# ===================================================================
# == JWT 설정 (spring과 같은 레벨, 들여쓰기 없음) ==
# ===================================================================
jwt:
  secret: 293IGlzIHRoaXMgc2VjcmV0IGtleT8gSXQgaXMgYSB2ZXJ5IHNlY3JldCBrZXkuIFBsZWFzZSBkb24ndCB0ZWxsIGFueW9uZSE=
  access-token-expiration-millis: 1800000