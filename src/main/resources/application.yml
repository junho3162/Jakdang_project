# Spring Boot 애플리케이션의 모든 설정을 관리하는 파일입니다.
server:
  port: ${PORT:8080}

spring:
  # ===================================================================
  # == Render 배포용 (PostgreSQL) 설정 - 주석 처리합니다. ==
  # ===================================================================
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        show_sql: true
        format_sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  # ===================================================================
  # == 로컬 개발용 (MySQL) 설정 - 이 설정의 주석을 모두 해제합니다. ==
  # ===================================================================
  #datasource:
  #  driver-class-name: com.mysql.cj.jdbc.Driver
  #  url: jdbc:mysql://localhost:3306/jakdang_db?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
  #  username: root
  #  password: 316298 # Juno님의 MySQL 비밀번호
  #jpa:
  #  hibernate:
  #    ddl-auto: update
  #  properties:
  #    hibernate:
  #      show_sql: true
  #      format_sql: true
  #  database-platform: org.hibernate.dialect.MySQLDialect


  # Spring Mail 설정 (보안을 위해 비밀번호는 환경 변수로 이동 - 로컬에서도 동일하게 사용 가능)
  mail:
    host: smtp.gmail.com
    port: 465
    username: ${SPRING_MAIL_USERNAME}
    password: ${SPRING_MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          ssl: # [변경] starttls 대신 ssl 설정을 켭니다.
            enable: true
            trust: smtp.gmail.com # [추가] 신뢰할 수 있는 서버로 명시
          starttls:
            enable: false         # [변경] 465 포트에서는 starttls를 끕니다.

