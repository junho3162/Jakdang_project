# Spring Boot 애플리케이션의 모든 설정을 관리하는 파일입니다.
server:
  port: 8080

spring:
  # ===================================================================
  # == Render 배포용 (PostgreSQL) 설정 - GitHub에 Push할 때는 이 설정을 사용합니다. ==
  # ===================================================================
  datasource:
    # url, username, password는 Render 대시보드에서 환경 변수로 주입할 것입니다.
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        show_sql: true
        format_sql: true
    # 통역사를 PostgreSQL용으로 변경합니다.
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  # ===================================================================
  # == 로컬 개발용 (MySQL) 설정 - 내 컴퓨터에서 테스트할 때 이 설정의 주석을 풀고 위 설정을 주석 처리합니다. ==
