  # Spring Mail 설정 (보안을 위해 비밀번호는 환경 변수로 이동)
  mail:
    host: smtp.gmail.com
    port: 587
    username: jakdangmoeui.certification@gmail.com
    password: ${SPRING_MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

# JWT 설정 (보안을 위해 secret은 환경 변수로 이동)
jwt:
  secret: ${JWT_SECRET}
  access-token-expiration-millis: 1800000
