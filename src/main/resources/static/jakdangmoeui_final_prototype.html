<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>작당모의 - 한서대학교 팀프로젝트 성공 플랫폼</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #f0f2f5; }
        .page { display: none; animation: fadeIn 0.5s; }
        .page.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .main-content { width: 100%; max-width: 1280px; margin: 0 auto; }
        .modal-content { animation: slideUp 0.3s; }
        @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3b82f6;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="text-gray-800">

<div id="app-container" class="min-h-screen">

    <header id="navbar" class="bg-white shadow-md sticky top-0 z-50 hidden">
        <nav class="main-content h-16 flex items-center justify-between px-6">
            <div class="flex items-center space-x-8">
                <a href="#" onclick="loadCommunityPage()" class="text-2xl font-bold text-blue-600">작당모의</a>
                <a href="#" onclick="loadCommunityPage()" class="text-gray-600 hover:text-blue-600 font-semibold">모집 공고</a>
                <a href="#" onclick="showPage('page-create-team')" class="text-gray-600 hover:text-blue-600 font-semibold">팀 만들기</a>
                <a href="#" onclick="alert('강의실 예약 기능은 구현 예정입니다.')" class="text-gray-600 hover:text-blue-600 font-semibold">강의실 예약</a>
            </div>
            <div class="flex items-center space-x-6">
                <a href="#" onclick="loadMyPage()" class="text-gray-600 hover:text-blue-600 font-semibold">마이페이지</a>
                <a href="#" onclick="logout()" class="bg-gray-200 text-gray-700 px-4 py-2 rounded-lg font-semibold hover:bg-gray-300">로그아웃</a>
            </div>
        </nav>
    </header>

    <main class="pt-8 pb-16">
        <!-- 페이지 컨테이너들 -->
        <div id="page-start" class="page active"></div>
        <div id="page-login" class="page"></div>
        <div id="page-signup" class="page"></div>
        <div id="page-forgot-password" class="page"></div>
        <div id="page-community" class="page"></div>
        <div id="page-create-team" class="page"></div>
        <div id="page-team-detail" class="page"></div>
        <div id="page-mypage" class="page"></div>
    </main>

    <!-- 각종 Modal 컨테이너 -->
    <div id="apply-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50"></div>
</div>

<script>
    const API_BASE_URL = 'http://localhost:8080';

    // --- 전역 상태 변수 ---
    let myInfo = null;

    // --- 유틸리티 및 페이지 관리 ---
    const pages = document.querySelectorAll('.page');
    const navbar = document.getElementById('navbar');

    function showPage(pageId) {
        pages.forEach(page => page.classList.remove('active'));
        const targetPage = document.getElementById(pageId);
        if (targetPage) {
            targetPage.classList.add('active');
            window.scrollTo(0, 0);
        }
    }

    // --- JWT 토큰 관리 ---
    function saveToken(token) { localStorage.setItem('accessToken', token); }
    function getToken() { return localStorage.getItem('accessToken'); }
    function removeToken() { localStorage.removeItem('accessToken'); }

    async function apiFetch(endpoint, options = {}) {
        const token = getToken();
        const headers = { 'Content-Type': 'application/json', ...options.headers };
        if (token) { headers['Authorization'] = `Bearer ${token}`; }
        try {
            const response = await fetch(`${API_BASE_URL}${endpoint}`, { ...options, headers });
            if (response.status === 401 || response.status === 403) {
                alert('인증 정보가 유효하지 않거나 권한이 없습니다. 다시 로그인해주세요.');
                logout();
                throw new Error('Unauthorized');
            }
            return response;
        } catch (error) {
            if (error.message !== 'Unauthorized') {
                console.error(`API Fetch Error (${endpoint}):`, error);
                alert('네트워크 오류가 발생했습니다. 백엔드 서버가 실행 중인지 확인해주세요.');
            }
            throw error;
        }
    }

    // --- 인증(Authentication) 관련 함수 ---
    async function login() {
        const email = document.getElementById('login-email').value;
        const password = document.getElementById('login-password').value;
        try {
            const response = await apiFetch('/api/login', {
                method: 'POST', body: JSON.stringify({ email, password }),
            });
            if (response.ok) {
                const tokenInfo = await response.json();
                alert('로그인에 성공했습니다!');
                saveToken(tokenInfo.accessToken);
                navbar.classList.remove('hidden');
                await loadMyInfo();
                loadCommunityPage();
            } else {
                alert(`로그인 실패: ${await response.text()}`);
            }
        } catch (error) {}
    }

    async function requestVerificationCode(type) {
        const emailInputId = type === 'password' ? 'forgot-email' : 'signup-email';
        const email = document.getElementById(emailInputId).value;
        const endpoint = type === 'password' ? '/api/email/password/verification-requests' : '/api/email/verification-requests';
        try {
            const response = await apiFetch(endpoint, { method: 'POST', body: JSON.stringify({ email }) });
            alert(await response.text());
        } catch(error) {}
    }

    async function signup() {
        const signupData = {
            email: document.getElementById('signup-email').value,
            verificationCode: document.getElementById('signup-verification-code').value,
            password: document.getElementById('signup-password').value,
            username: document.getElementById('signup-name').value,
            nickname: document.getElementById('signup-nickname').value,
            grade: document.getElementById('signup-grade').value,
            department: document.getElementById('signup-department').value,
        };
        try {
            const response = await apiFetch('/api/signup', { method: 'POST', body: JSON.stringify(signupData) });
            const responseText = await response.text();
            if(response.ok) {
                alert(responseText);
                showPage('page-login');
            } else {
                alert(`회원가입 실패: ${responseText}`);
            }
        } catch (error) {}
    }

    function logout() {
        removeToken();
        myInfo = null;
        navbar.classList.add('hidden');
        renderStartPage();
        showPage('page-start');
    }

    // --- 페이지 렌더링 함수 ---
    function renderStartPage() {
        document.getElementById('page-start').innerHTML = `
                <div class="min-h-screen flex items-center justify-center">
                    <div class="text-center">
                        <h1 class="text-6xl font-extrabold text-blue-600 mb-4">작당모의</h1>
                        <p class="text-2xl text-gray-600 mb-12">한서대학교 팀프로젝트, 이제는 똑똑하게.</p>
                        <button onclick="showPage('page-login')" class="bg-blue-600 text-white font-bold py-4 px-10 text-xl rounded-lg hover:bg-blue-700 transition duration-300 shadow-lg">웹메일로 시작하기</button>
                    </div>
                </div>`;
    }

    function renderLoginPage() {
        document.getElementById('page-login').innerHTML = `
                 <div class="flex flex-col items-center justify-center pt-20">
                     <div class="w-full max-w-md bg-white shadow-xl rounded-lg p-10">
                        <button onclick="showPage('page-start')" class="text-sm text-blue-600 hover:underline mb-6">← 시작 페이지로</button>
                         <h2 class="text-3xl font-bold text-gray-800 mb-8 text-center">로그인</h2>
                         <div class="space-y-4">
                             <div>
                                 <label for="login-email" class="block text-gray-700 text-sm font-bold mb-2">한서대학교 오피스 메일</label>
                                 <input type="email" id="login-email" class="shadow-sm border rounded w-full py-3 px-4" placeholder="id@office.hanseo.ac.kr">
                             </div>
                             <div>
                                 <label for="login-password" class="block text-gray-700 text-sm font-bold mb-2">비밀번호</label>
                                 <input type="password" id="login-password" class="shadow-sm border rounded w-full py-3 px-4">
                             </div>
                         </div>
                        <button onclick="login()" class="w-full bg-blue-600 text-white font-bold py-3 px-4 rounded-lg hover:bg-blue-700 mt-8">로그인</button>
                        <div class="text-center mt-6 text-sm">
                            <a href="#" onclick="showPage('page-signup')" class="font-semibold text-gray-500 hover:text-blue-700">회원가입</a>
                            <span class="mx-2 text-gray-300">|</span>
                            <a href="#" onclick="showPage('page-forgot-password')" class="font-semibold text-gray-500 hover:text-blue-700">비밀번호 찾기</a>
                        </div>
                     </div>
                </div>`;
    }

    function renderSignupPage() {
        document.getElementById('page-signup').innerHTML = `
                 <div class="flex flex-col items-center justify-center pt-12">
                     <div class="w-full max-w-md bg-white shadow-xl rounded-lg p-10">
                        <button onclick="showPage('page-login')" class="text-sm text-blue-600 hover:underline mb-6">← 로그인 페이지로</button>
                         <h2 class="text-3xl font-bold text-gray-800 mb-8 text-center">회원가입</h2>
                         <div class="space-y-4">
                            <div>
                                 <label for="signup-email" class="block text-gray-700 text-sm font-bold mb-2">한서대학교 오피스 메일</label>
                                 <div class="flex space-x-2">
                                    <input type="email" id="signup-email" class="shadow-sm border rounded w-full py-3 px-4" placeholder="id@office.hanseo.ac.kr">
                                    <button onclick="requestVerificationCode('signup')" class="bg-gray-600 text-white font-semibold px-4 rounded-lg hover:bg-gray-700 whitespace-nowrap">인증 요청</button>
                                 </div>
                            </div>
                             <div>
                                 <label for="signup-verification-code" class="block text-gray-700 text-sm font-bold mb-2">인증 코드</label>
                                 <input type="text" id="signup-verification-code" class="shadow-sm border rounded w-full py-3 px-4" placeholder="이메일로 받은 6자리 코드를 입력하세요">
                             </div>
                            <div>
                                 <label for="signup-password" class="block text-gray-700 text-sm font-bold mb-2">비밀번호</label>
                                 <input type="password" id="signup-password" class="shadow-sm border rounded w-full py-3 px-4">
                            </div>
                             <div>
                                 <label for="signup-name" class="block text-gray-700 text-sm font-bold mb-2">이름</label>
                                 <input type="text" id="signup-name" class="shadow-sm border rounded w-full py-3 px-4" placeholder="실명 입력">
                            </div>
                            <div>
                                 <label for="signup-nickname" class="block text-gray-700 text-sm font-bold mb-2">닉네임</label>
                                 <input type="text" id="signup-nickname" class="shadow-sm border rounded w-full py-3 px-4" placeholder="작당모의에서 사용할 이름">
                            </div>
                            <div>
                                <label for="signup-grade" class="block text-gray-700 text-sm font-bold mb-2">학년</label>
                                <select id="signup-grade" class="shadow-sm border rounded w-full py-3 px-4 bg-white">
                                    <option>1학년</option> <option>2학년</option> <option>3학년</option> <option>4학년</option> <option>기타</option>
                                </select>
                            </div>
                            <div>
                                <label for="signup-department" class="block text-gray-700 text-sm font-bold mb-2">학과</label>
                                <select id="signup-department" class="shadow-sm border rounded w-full py-3 px-4 bg-white">
                                    <option>컴퓨터공학과</option> <option>항공소프트웨어공학과</option><option>시각디자인학과</option>
                                </select>
                            </div>
                         </div>
                         <button onclick="signup()" class="w-full bg-blue-600 text-white font-bold py-3 px-4 rounded-lg hover:bg-blue-700 mt-8">회원가입 완료</button>
                     </div>
                </div>`;
    }

    // --- 모집 공고(Team) 관련 함수 ---
    async function loadCommunityPage() {
        showPage('page-community');
        const container = document.getElementById('page-community');
        container.innerHTML = `
                <div class="main-content px-6">
                    <h1 class="text-3xl font-bold mb-6">모집 공고</h1>
                    <div id="team-list-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
                        <div class="loader"></div>
                    </div>
                </div>`;
        try {
            const response = await apiFetch('/api/teams');
            const teams = await response.json();
            renderTeamList(teams);
        } catch (error) {}
    }

    function renderTeamList(teams) {
        const container = document.getElementById('team-list-container');
        container.innerHTML = '';
        if (teams.length === 0) {
            container.innerHTML = '<p class="col-span-full text-center text-gray-500">아직 등록된 모집 공고가 없습니다.</p>'; return;
        }
        teams.forEach(team => {
            const card = document.createElement('div');
            card.className = "bg-white rounded-lg shadow-md p-6 cursor-pointer hover:shadow-xl hover:-translate-y-1 transition-all";
            card.onclick = () => loadTeamDetailPage(team.id);
            card.innerHTML = `
                    <div class="flex justify-between items-start mb-3">
                        <span class="bg-blue-100 text-blue-800 text-xs font-semibold px-2.5 py-1 rounded-full">${team.category}</span>
                        <span class="text-xs font-medium text-white ${team.status === '모집중' ? 'bg-green-500' : 'bg-gray-500'} px-2 py-1 rounded-full">${team.status}</span>
                    </div>
                    <h3 class="text-lg font-bold text-gray-900 mb-2 truncate">${team.title}</h3>
                    <div class="flex items-center justify-between text-sm text-gray-500 mt-4">
                        <span>최대 ${team.maxMembers}명</span>
                        <span>👑 ${team.leaderNickname}</span>
                    </div>`;
            container.appendChild(card);
        });
    }

    async function loadTeamDetailPage(teamId) {
        showPage('page-team-detail');
        const container = document.getElementById('page-team-detail');
        container.innerHTML = `<div class="loader"></div>`;
        try {
            const response = await apiFetch(`/api/teams/${teamId}`);
            const team = await response.json();
            renderTeamDetail(team);
        } catch(error) {}
    }

    function renderTeamDetail(team) {
        const container = document.getElementById('page-team-detail');
        // 팀장인지 여부 확인
        const isLeader = myInfo && myInfo.nickname === team.leaderNickname;
        let actionButtons = '';
        if (isLeader) {
            actionButtons = `
                    <button class="bg-yellow-500 text-white font-bold py-2 px-4 rounded-lg hover:bg-yellow-600">공고 수정</button>
                    <button class="bg-red-500 text-white font-bold py-2 px-4 rounded-lg hover:bg-red-600">공고 삭제</button>
                    <button class="bg-green-500 text-white font-bold py-2 px-4 rounded-lg hover:bg-green-600">지원자 보기</button>
                 `;
        } else {
            actionButtons = `<button class="bg-blue-600 text-white font-bold py-2 px-4 rounded-lg hover:bg-blue-700">이 팀에 지원하기</button>`;
        }

        container.innerHTML = `
                <div class="main-content px-6">
                    <button onclick="loadCommunityPage()" class="text-sm text-blue-600 hover:underline mb-4">← 목록으로</button>
                    <div class="bg-white p-8 rounded-lg shadow-lg">
                        <div class="flex justify-between items-start">
                            <div>
                                <span class="bg-gray-200 text-gray-800 text-sm font-semibold px-3 py-1 rounded-full">${team.category}</span>
                                <h1 class="text-3xl font-bold mt-3">${team.title}</h1>
                                <p class="text-gray-500 mt-2">팀장: ${team.leaderNickname} / 상태: ${team.status}</p>
                            </div>
                            <div class="text-right">
                                <p class="text-gray-600 mt-1">최대 ${team.maxMembers}명</p>
                            </div>
                        </div>
                        <div class="border-t my-6"></div>
                        <p class="text-gray-700 leading-relaxed whitespace-pre-line">${team.content}</p>
                        <div class="border-t my-8"></div>
                        <div class="flex justify-end space-x-4">
                           ${actionButtons}
                        </div>
                    </div>
                </div>
            `;
    }

    // --- 마이페이지 관련 함수 ---
    async function loadMyInfo() {
        try {
            if (!getToken()) return;
            const response = await apiFetch('/api/mypage');
            myInfo = await response.json();
        } catch (error) {}
    }

    async function loadMyPage() {
        showPage('page-mypage');
        const container = document.getElementById('page-mypage');
        container.innerHTML = `<div class="loader"></div>`;
        if (!myInfo) await loadMyInfo();

        if (myInfo) {
            renderMyPage(myInfo);
        } else {
            container.innerHTML = '<p class="text-center">사용자 정보를 불러오지 못했습니다.</p>';
        }
    }

    function renderMyPage(user) {
        const container = document.getElementById('page-mypage');
        container.innerHTML = `
                    <div class="main-content px-6">
                         <h1 class="text-3xl font-bold mb-8">마이페이지</h1>
                         <div class="bg-white p-6 rounded-lg shadow-lg">
                             <p><span class="font-semibold w-20 inline-block">닉네임:</span> ${user.nickname}</p>
                             <p><span class="font-semibold w-20 inline-block">이름:</span> ${user.username}</p>
                             <p><span class="font-semibold w-20 inline-block">이메일:</span> ${user.email}</p>
                             <p><span class="font-semibold w-20 inline-block">학년:</span> ${user.grade}</p>
                             <p><span class="font-semibold w-20 inline-block">학과:</span> ${user.department}</p>
                         </div>
                    </div>`;
    }

    // --- 페이지 로드 시 초기화 ---
    document.addEventListener('DOMContentLoaded', () => {
        renderStartPage();
        renderLoginPage();
        renderSignupPage();
        // TODO: 다른 페이지들도 초기 렌더링 함수 호출

        if (getToken()) {
            navbar.classList.remove('hidden');
            loadMyInfo().then(loadCommunityPage);
        } else {
            showPage('page-start');
        }
    });

</script>
</body>
</html>
